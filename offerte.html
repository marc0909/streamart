<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gratis Offerte</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
        <h1>Gratis Offerte</h1>
        <p>Vul hieronder je gegevens in en wij nemen snel contact op.</p>

        <div class="form-box">
            <form action="https://formspree.io/f/mwvaqvwo" method="POST">
                <label>Naam</label>
                <input type="text" name="naam" required>

                <label>Email</label>
                <input type="email" name="email" required>

                <label>Bericht</label>
                <textarea name="bericht" rows="5" required></textarea>

                <button type="submit" class="btn blue">Versturen</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
