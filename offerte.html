<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gratis Offerte</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">
    <h1>Gratis Offerte</h1>

    <p>Vul hieronder je gegevens in en wij nemen snel contact op.</p>

    <form>
        <label>Naam</label>
        <input type="text" name="naam" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Bericht</label>
        <textarea name="bericht" rows="5" required></textarea>

        <button type="submit" class="btn blue">Versturen</button>
    </form>
</main>

</body>
</html>
